<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الحكام - لجنة الحكام الرئيسية - التطوير</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="user-info">
            <span class="user-name" id="adminName">أدمن</span>
            <span class="user-role">مدير النظام</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="admin-supervisors.html" class="nav-item">
            <i class="fa fa-eye"></i>
            <span>إدارة المراقبين</span>
          </a>
          <a href="admin-referees.html" class="nav-item active">
            <i class="fa fa-flag-checkered"></i>
            <span>إدارة الحكام</span>
          </a>
          <a href="admin-matches.html" class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات والتعيينات</span>
          </a>
          <a href="admin-competitions.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>المسابقات والفرق</span>
          </a>
          <a href="admin-finance.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>المالية</span>
          </a>
          <a href="admin-reports.html" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>التقارير</span>
          </a>
          <a href="admin-users.html" class="nav-item">
            <i class="fas fa-users-cog"></i>
            <span>إدارة المستخدمين</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0">إدارة الحكام</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <div class="content-wrapper">
        <!-- Filters -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <input
                  type="text"
                  class="form-control"
                  id="searchReferee"
                  placeholder="بحث عن حكم..."
                />
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterDegree">
                  <option value="">جميع الدرجات</option>
                  <option value="1st">درجة أولى</option>
                  <option value="2nd">درجة ثانية</option>
                  <option value="3rd">درجة ثالثة</option>
                  <option value="International">دولي</option>
                  <option value="New">جدد</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="filterStatus">
                  <option value="">جميع الحالات</option>
                  <option value="active">نشط</option>
                  <option value="suspended">موقوف</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-primary w-100" id="addRefereeBtn">
                  <i class="fas fa-plus me-2"></i>إضافة حكم
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Referees Table -->
        <div class="glass-card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0" id="refereesTable">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>المنطقة</th>
                    <th>العمر</th>
                    <th>الدرجة</th>
                    <th>الوظيفة</th>
                    <th>VAR</th>
                    <th>رقم الهاتف</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody id="refereesBody">
                  <!-- Dynamic content -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Referee Modal -->
    <div class="modal fade" id="refereeModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="refereeModalTitle">إضافة حكم جديد</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="refereeForm">
              <input type="hidden" id="refereeId" />
              <div class="row g-3">
                <!-- الاسم رباعي -->
                <div class="col-md-12">
                  <label class="form-label">الاسم الرباعي *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    required
                    placeholder="محمد أحمد علي حسن"
                  />
                </div>

                <!-- المنطقة -->
                <div class="col-md-6">
                  <label class="form-label">المنطقة *</label>
                  <select class="form-select" id="region" required>
                    <option value="">اختر المنطقة</option>
                    <option value="القاهره">القاهره</option>
                    <option value="الجيزه">الجيزه</option>
                    <option value="الاسكندرية">الاسكندرية</option>
                    <option value="الشرقيه">الشرقيه</option>
                    <option value="الدقهليه">الدقهليه</option>
                    <option value="البحيرة">البحيرة</option>
                    <option value="الغربيه">الغربيه</option>
                    <option value="المنوفيه">المنوفيه</option>
                    <option value="القليوبيه">القليوبيه</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="اسيوط">اسيوط</option>
                    <option value="الأقصر">الأقصر</option>
                    <option value="اسوان">اسوان</option>
                    <option value="بورسعيد">بورسعيد</option>
                    <option value="السويس">السويس</option>
                    <option value="الاسماعيليه">الاسماعيليه</option>
                    <option value="الفيوم">الفيوم</option>
                    <option value="بنى سويف">بنى سويف</option>
                    <option value="المنيا">المنيا</option>
                    <option value="قنا">قنا</option>
                    <option value="دمياط">دمياط</option>
                    <option value="كفر الشيخ">كفر الشيخ</option>
                    <option value="شمال سيناء">شمال سيناء</option>
                    <option value="جنوب سيناء">جنوب سيناء</option>
                    <option value="الوادي الجديد">الوادي الجديد</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="مطروح">مطروح</option>
                  </select>
                </div>

                <!-- تاريخ الميلاد -->
                <div class="col-md-6">
                  <label class="form-label">تاريخ الميلاد *</label>
                  <input
                    type="date"
                    class="form-control"
                    id="birthDate"
                    required
                  />
                </div>

                <!-- الدرجة -->
                <div class="col-md-6">
                  <label class="form-label">الدرجة *</label>
                  <select class="form-select" id="degree" required>
                    <option value="1st">درجة أولى</option>
                    <option value="2nd">درجة ثانية</option>
                    <option value="3rd">درجة ثالثة</option>
                    <option value="International">دولي</option>
                    <option value="New">جدد</option>
                  </select>
                </div>

                <!-- الوظيفة -->
                <div class="col-md-6">
                  <label class="form-label">الوظيفة</label>
                  <select class="form-select" id="job">
                    <option value="referee">حكم</option>
                    <option value="assistant">حكم مساعد</option>
                    <option value="both">حكم وحكم مساعد</option>
                  </select>
                </div>

                <!-- رقم التليفون -->
                <div class="col-md-6">
                  <label class="form-label">رقم التليفون</label>
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    placeholder="01001234567"
                  />
                </div>

                <!-- العنوان -->
                <div class="col-md-6">
                  <label class="form-label">العنوان</label>
                  <input
                    type="text"
                    class="form-control"
                    id="address"
                    placeholder="العنوان بالتفصيل"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">صلاحيات VAR</label>
                  <div class="d-flex gap-3 pt-2">
                    <div class="form-check">
                      <input
                        type="checkbox"
                        class="form-check-input"
                        id="hasVarLicense"
                      />
                      <label class="form-check-label" for="hasVarLicense">
                        <span class="badge bg-danger">VAR</span>
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        type="checkbox"
                        class="form-check-input"
                        id="hasAvarLicense"
                      />
                      <label class="form-check-label" for="hasAvarLicense">
                        <span class="badge bg-warning">AVAR</span>
                      </label>
                    </div>
                  </div>
                  <small class="text-muted"
                    >اختر صلاحيات الحكم في تقنية VAR</small
                  >
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button type="button" class="btn btn-primary" id="saveRefereeBtn">
              حفظ
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Suspension Modal -->
    <div class="modal fade" id="suspensionModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">إدارة الإيقاف</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="suspendRefereeId" />
            <div class="mb-3">
              <label class="form-label">سبب الإيقاف</label>
              <textarea
                class="form-control"
                id="suspensionReason"
                rows="3"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">تاريخ انتهاء الإيقاف</label>
              <input type="date" class="form-control" id="suspensionEndDate" />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="applySuspensionBtn"
            >
              تطبيق الإيقاف
            </button>
            <button
              type="button"
              class="btn btn-success"
              id="removeSuspensionBtn"
            >
              إلغاء الإيقاف
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Referee Details Modal -->
    <div class="modal fade" id="refereeDetailsModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">تفاصيل الحكم</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="refereeDetailsContent">
            <!-- Dynamic content -->
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/admin/adminReferees.js"></script>
  </body>
</html>
