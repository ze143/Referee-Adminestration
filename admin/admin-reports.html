<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التقارير - لجنة الحكام الرئيسية - التطوير</title>

    <!-- Bootstrap 5.3 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome 6 -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- html2pdf (for PDF export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- xlsx (for Excel export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Custom Sports Theme -->
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="user-info">
            <span class="user-name" id="adminName">أدمن</span>
            <span class="user-role">مدير النظام</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="admin-supervisors.html" class="nav-item">
            <i class="fa fa-eye"></i>
            <span>إدارة المراقبين</span>
          </a>
          <a href="admin-referees.html" class="nav-item">
            <i class="fa fa-flag-checkered"></i>
            <span>إدارة الحكام</span>
          </a>
          <a href="admin-matches.html" class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات والتعيينات</span>
          </a>
          <a href="admin-evaluations.html" class="nav-item">
            <i class="fas fa-star"></i>
            <span>تقييمات الحكام</span>
          </a>
          <a href="admin-competitions.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>المسابقات والفرق</span>
          </a>
          <a href="admin-finance.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>المالية</span>
          </a>
          <a href="admin-reports.html" class="nav-item active">
            <i class="fas fa-file-alt"></i>
            <span>التقارير</span>
          </a>
          <a href="admin-users.html" class="nav-item">
            <i class="fas fa-users-cog"></i>
            <span>إدارة المستخدمين</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Top Navbar -->
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0">التقارير</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <div class="content-wrapper">
        <!-- Report Filters -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="row g-3 align-items-end">
              <div class="col-md-3">
                <label class="form-label">نوع التقرير</label>
                <select class="form-select" id="reportType">
                  <option value="matches">تقرير المباريات</option>
                  <option value="referees">تقرير الحكام</option>
                  <option value="evaluations">تقرير التقييمات</option>
                  <option value="supervisors">تقرير المراقبين</option>
                  <option value="competitions">تقرير المسابقات</option>
                  <option value="finance">التقرير المالي</option>
                </select>
              </div>

              <!-- ✅ فلتر المنطقة (يظهر مع تقرير الحكام فقط) -->
              <div
                class="col-md-3"
                id="regionFilterContainer"
                style="display: none"
              >
                <label class="form-label">المنطقة</label>
                <select class="form-select" id="reportFilterRegion">
                  <option value="">جميع المناطق</option>
                  <option value="القاهره">القاهره</option>
                  <option value="الجيزه">الجيزه</option>
                  <option value="الاسكندرية">الاسكندرية</option>
                  <option value="الشرقيه">الشرقيه</option>
                  <option value="الدقهليه">الدقهليه</option>
                  <option value="البحيرة">البحيرة</option>
                  <option value="الغربيه">الغربيه</option>
                  <option value="المنوفيه">المنوفيه</option>
                  <option value="القليوبيه">القليوبيه</option>
                  <option value="سوهاج">سوهاج</option>
                  <option value="اسيوط">اسيوط</option>
                  <option value="الأقصر">الأقصر</option>
                  <option value="اسوان">اسوان</option>
                  <option value="بورسعيد">بورسعيد</option>
                  <option value="السويس">السويس</option>
                  <option value="الاسماعيليه">الاسماعيليه</option>
                  <option value="الفيوم">الفيوم</option>
                  <option value="بنى سويف">بنى سويف</option>
                  <option value="المنيا">المنيا</option>
                  <option value="قنا">قنا</option>
                  <option value="دمياط">دمياط</option>
                  <option value="كفر الشيخ">كفر الشيخ</option>
                  <option value="شمال سيناء">شمال سيناء</option>
                  <option value="جنوب سيناء">جنوب سيناء</option>
                  <option value="الوادي الجديد">الوادي الجديد</option>
                  <option value="البحر الأحمر">البحر الأحمر</option>
                  <option value="مطروح">مطروح</option>
                </select>
              </div>

              <!-- ✅ فلتر الوظيفة (يظهر مع تقرير الحكام فقط) -->
              <div
                class="col-md-3"
                id="jobFilterContainer"
                style="display: none"
              >
                <label class="form-label">الوظيفة</label>
                <select class="form-select" id="reportFilterJob">
                  <option value="">جميع الوظائف</option>
                  <option value="referee">حكم</option>
                  <option value="assistant">حكم مساعد</option>
                  <option value="both">حكم ومساعد</option>
                </select>
              </div>
              <!-- ✅ فلتر الحد الأدنى للتقييم (يظهر مع تقرير التقييمات فقط) -->
              <div
                class="col-md-3"
                id="minRatingFilterContainer"
                style="display: none"
              >
                <label class="form-label">الحد الأدنى للتقييم</label>
                <select class="form-select" id="reportFilterMinRating">
                  <option value="">الكل</option>
                  <option value="90">90 فأكثر</option>
                  <option value="80">80 فأكثر</option>
                  <option value="70">70 فأكثر</option>
                  <option value="60">60 فأكثر</option>
                  <option value="50">50 فأكثر</option>
                  <option value="less60">أقل من 60</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">من تاريخ</label>
                <input
                  type="date"
                  class="form-control"
                  id="reportDateFrom"
                  placeholder="اختر التاريخ"
                />
              </div>
              <div class="col-md-3">
                <label class="form-label">إلى تاريخ</label>
                <input
                  type="date"
                  class="form-control"
                  id="reportDateTo"
                  placeholder="اختر التاريخ"
                />
              </div>
              <div class="col-md-3">
                <button class="btn btn-primary w-100" id="generateReportBtn">
                  <i class="fas fa-chart-bar me-2"></i>إنشاء التقرير
                </button>
              </div>
            </div>
            <div class="row g-3 mt-2">
              <div class="col-md-12">
                <button class="btn btn-success me-2" id="exportReportExcel">
                  <i class="fas fa-file-excel me-2"></i>تصدير Excel
                </button>
                <button class="btn btn-danger" id="exportReportPdf">
                  <i class="fas fa-file-pdf me-2"></i>تصدير PDF
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Report Content -->
        <div class="glass-card">
          <div class="card-body">
            <div id="reportContent">
              <div class="text-center py-5 text-muted">
                <i class="fas fa-file-alt fa-3x mb-3"></i>
                <p>اختر نوع التقرير والفترة الزمنية ثم اضغط "إنشاء التقرير"</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/admin/adminReports.js"></script>
  </body>
</html>
