<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة المراقبين - لجنة الحكام الرئيسية - التطوير</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />

    <style>
      /* ✅ تحسين شكل الفلاتر */
      .filter-section {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .filter-section .form-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #6c757d;
        margin-bottom: 4px;
      }
      .filter-section .form-control,
      .filter-section .form-select {
        font-size: 0.85rem;
        border-radius: 8px;
      }
      .filter-section .btn-filter {
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 0.85rem;
      }
      .filter-badge {
        background: #e9ecef;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.7rem;
        color: #495057;
        margin-right: 5px;
      }
      .filter-badge .remove-filter {
        cursor: pointer;
        color: #dc3545;
        margin-right: 5px;
        font-weight: bold;
      }
      .filter-badge .remove-filter:hover {
        color: #bd2130;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar">
            <i class="fas fa-user-shield"></i>
          </div>
          <div class="user-info">
            <span class="user-name" id="adminName">أدمن</span>
            <span class="user-role">مدير النظام</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="admin-supervisors.html" class="nav-item active">
            <i class="fa fa-eye"></i>
            <span>إدارة المراقبين</span>
          </a>
          <a href="admin-referees.html" class="nav-item">
            <i class="fa fa-flag-checkered"></i>
            <span>إدارة الحكام</span>
          </a>
          <a href="admin-matches.html" class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات والتعيينات</span>
          </a>
          <a href="admin-competitions.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>المسابقات والفرق</span>
          </a>
          <a href="admin-finance.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>المالية</span>
          </a>
          <a href="admin-reports.html" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>التقارير</span>
          </a>
          <a href="admin-users.html" class="nav-item">
            <i class="fas fa-users-cog"></i>
            <span>إدارة المستخدمين</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0 p-2">إدارة المراقبين</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <div class="content-wrapper">
        <!-- ✅ Filters Section -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="filter-section">
              <div class="row g-2">
                <!-- بحث بالاسم -->
                <div class="col-md-4">
                  <input
                    type="text"
                    class="form-control"
                    id="filterName"
                    placeholder="ابحث باسم المراقب..."
                  />
                </div>

                <!-- فلتر المنطقة -->
                <div class="col-md-3">
                  <select class="form-select" id="filterRegion">
                    <option value="">جميع المناطق</option>
                    <option value="القاهره">القاهره</option>
                    <option value="الجيزه">الجيزه</option>
                    <option value="الاسكندرية">الاسكندرية</option>
                    <option value="الشرقيه">الشرقيه</option>
                    <option value="الدقهليه">الدقهليه</option>
                    <option value="البحيرة">البحيرة</option>
                    <option value="الغربيه">الغربيه</option>
                    <option value="المنوفيه">المنوفيه</option>
                    <option value="القليوبيه">القليوبيه</option>
                    <option value="سوهاج">سوهاج</option>
                    <option value="اسيوط">اسيوط</option>
                    <option value="الأقصر">الأقصر</option>
                    <option value="اسوان">اسوان</option>
                    <option value="بورسعيد">بورسعيد</option>
                    <option value="السويس">السويس</option>
                    <option value="الاسماعيليه">الاسماعيليه</option>
                    <option value="الفيوم">الفيوم</option>
                    <option value="بنى سويف">بنى سويف</option>
                    <option value="المنيا">المنيا</option>
                    <option value="قنا">قنا</option>
                    <option value="دمياط">دمياط</option>
                    <option value="كفر الشيخ">كفر الشيخ</option>
                    <option value="سيناء">سيناء</option>
                    <option value="الوادي الجديد">الوادي الجديد</option>
                    <option value="البحر الأحمر">البحر الأحمر</option>
                    <option value="مطروح">مطروح</option>
                  </select>
                </div>

                <!-- فلتر عدد المباريات -->
                <div class="col-md-3">
                  <select class="form-select" id="filterMatchesCount">
                    <option value="">الكل</option>
                    <option value="0">بدون مباريات</option>
                    <option value="1-5">1 - 5 مباريات</option>
                    <option value="6-10">6 - 10 مباريات</option>
                    <option value="11+">أكثر من 10 مباريات</option>
                  </select>
                </div>

                <!-- أزرار الإجراءات -->
                <div class="col-md-2">
                  <button
                    class="btn btn-primary w-100 btn-filter"
                    id="applyFiltersBtn"
                  >
                    <i class="fas fa-filter me-2"></i>تطبيق الفلتر
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>

        <!-- Supervisors Table -->
        <div class="glass-card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h5>
              <i class="fas fa-user-tie me-2"></i>المراقبين
              <span class="badge bg-secondary ms-2" id="filteredCount">0</span>
            </h5>
            <div>
              <button
                class="btn btn-success btn-sm me-2"
                id="exportSupervisorsBtn"
              >
                <i class="fas fa-file-excel me-2"></i>تصدير Excel
              </button>
              <button class="btn btn-primary btn-sm" id="addSupervisorBtn">
                <i class="fas fa-plus me-2"></i>إضافة مراقب
              </button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>الاسم</th>
                    <th>المنطقة</th>
                    <th>رقم الهاتف</th>
                    <th>عدد المباريات</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody id="supervisorsBody">
                  <!-- Dynamic content -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Supervisor Modal -->
    <div class="modal fade" id="supervisorModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="supervisorModalTitle">
              إضافة مراقب جديد
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="supervisorForm">
              <input type="hidden" id="supervisorId" />
              <div class="mb-3">
                <label class="form-label">الاسم الكامل *</label>
                <input
                  type="text"
                  class="form-control"
                  id="supervisorName"
                  required
                />
              </div>
              <!-- المنطقة -->
              <div class="mb-3">
                <label class="form-label">المنطقة *</label>
                <select class="form-select" id="supervisorRegion" required>
                  <option value="">اختر المنطقة</option>
                  <option value="القاهره">القاهره</option>
                  <option value="الجيزه">الجيزه</option>
                  <option value="الاسكندرية">الاسكندرية</option>
                  <option value="الشرقيه">الشرقيه</option>
                  <option value="الدقهليه">الدقهليه</option>
                  <option value="البحيرة">البحيرة</option>
                  <option value="الغربيه">الغربيه</option>
                  <option value="المنوفيه">المنوفيه</option>
                  <option value="القليوبيه">القليوبيه</option>
                  <option value="سوهاج">سوهاج</option>
                  <option value="اسيوط">اسيوط</option>
                  <option value="الأقصر">الأقصر</option>
                  <option value="اسوان">اسوان</option>
                  <option value="بورسعيد">بورسعيد</option>
                  <option value="السويس">السويس</option>
                  <option value="الاسماعيليه">الاسماعيليه</option>
                  <option value="الفيوم">الفيوم</option>
                  <option value="بنى سويف">بنى سويف</option>
                  <option value="المنيا">المنيا</option>
                  <option value="قنا">قنا</option>
                  <option value="دمياط">دمياط</option>
                  <option value="كفر الشيخ">كفر الشيخ</option>
                  <option value="سيناء">سيناء</option>
                  <option value="الوادي الجديد">الوادي الجديد</option>
                  <option value="البحر الأحمر">البحر الأحمر</option>
                  <option value="مطروح">مطروح</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" class="form-control" id="supervisorPhone" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              إلغاء
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="saveSupervisorBtn"
            >
              حفظ
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/admin/adminSupervisors.js"></script>
  </body>
</html>
