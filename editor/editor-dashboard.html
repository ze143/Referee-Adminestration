<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم المنسق - لجنة الحكام الرئيسية - التطوير</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar">
            <i class="fas fa-user-edit"></i>
          </div>
          <div class="user-info">
            <span class="user-name" id="editorName">منسق</span>
            <span class="user-role">منسق مشروط</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="editor-dashboard.html" class="nav-item active">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="editor-matches.html" class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات والتعيينات</span>
          </a>
          <a href="editor-referees.html" class="nav-item">
            <i class="fa fa-flag-checkered"></i>
            <span>الحكام (عرض فقط)</span>
          </a>
          <a href="editor-reports.html" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>التقارير (عرض فقط)</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0">لوحة تحكم المنسق</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <div class="content-wrapper">
        <!-- Scope Info -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="d-flex align-items-center gap-3">
              <i class="fas fa-info-circle fa-2x text-info"></i>
              <div>
                <h6 class="mb-1">نطاق صلاحياتك</h6>
                <p class="text-muted mb-0" id="editorScopeInfo">
                  جارٍ التحميل...
                </p>
              </div>
            </div>
          </div>
        </div>

        <!-- KPI Cards -->
        <div class="row g-4 mb-4">
          <div class="col-md-3">
            <div class="kpi-card gradient-green">
              <div class="kpi-icon"><i class="fas fa-calendar-check"></i></div>
              <div class="kpi-content">
                <h3 class="kpi-value" id="totalMatches">0</h3>
                <p class="kpi-label">إجمالي المباريات</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card gradient-blue">
              <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
              <div class="kpi-content">
                <h3 class="kpi-value" id="assignedMatches">0</h3>
                <p class="kpi-label">مباريات معينة</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card gradient-orange">
              <div class="kpi-icon"><i class="fas fa-clock"></i></div>
              <div class="kpi-content">
                <h3 class="kpi-value" id="pendingMatches">0</h3>
                <p class="kpi-label">مباريات بدون حكام</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="kpi-card gradient-purple">
              <div class="kpi-icon"><i class="fa fa-flag-checkered"></i></div>
              <div class="kpi-content">
                <h3 class="kpi-value" id="totalReferees">0</h3>
                <p class="kpi-label">إجمالي الحكام</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart -->
        <div class="row g-4">
          <div class="col-md-12">
            <div class="chart-card glass-card">
              <div class="card-header">
                <h5>
                  <i class="fas fa-chart-bar me-2"></i>المباريات حسب المسابقة
                </h5>
              </div>
              <div class="card-body">
                <canvas id="editorMatchChart" height="250"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/editor/editorDashboard.js"></script>
  </body>
</html>
