<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة لجنة الحكام الرئيسية - التطوير </title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-wrapper">
        <div class="login-header">
          <div class="login-logo">
            <i class="fas fa-futbol"></i>
            <h1>لجنة الحكام الرئيسية - التطوير</h1>
          </div>
          <p class="login-subtitle">نظام إدارة الحكام والمباريات</p>
        </div>

        <div class="login-card glass-card">
          <div class="login-card-header">
            <h5 class="card-title">تسجيل الدخول</h5>
            <p class="text-muted">أدخل بريدك الإلكتروني وكلمة المرور</p>
          </div>
          <div class="login-card-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="fas fa-envelope"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="********@********.com"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="fas fa-lock"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt me-2"></i>تسجيل الدخول
              </button>
            </form>
          </div>
        </div>

        <div class="login-footer">
          <p>© 2026 جميع الحقوق محفوظة<br>لجنة الحكام الرئيسية - التطوير  </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
