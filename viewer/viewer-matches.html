<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المباريات - رئيس اللجنة - لجنة الحكام الرئيسية - التطوير</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar"><i class="fas fa-user-tie"></i></div>
          <div class="user-info">
            <span class="user-name" id="viewerName">رئيس اللجنة</span>
            <span class="user-role">مشاهد</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="viewer-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="viewer-matches.html" class="nav-item active">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات</span>
          </a>
          <a href="viewer-referees.html" class="nav-item">
            <i class="fa fa-flag-checkered"></i>
            <span>الحكام</span>
          </a>
          <a href="viewer-finance.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>المالية</span>
          </a>
          <a href="viewer-reports.html" class="nav-item">
            <i class="fas fa-file-alt"></i>
            <span>التقارير</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0">المباريات - عرض فقط</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <div class="content-wrapper">
        <!-- Read-only Notice -->
        <div class="alert alert-info alert-dismissible fade show" role="alert">
          <i class="fas fa-info-circle me-2"></i>
          هذه الصفحة للعرض فقط. يمكنك <strong>مشاهدة</strong> جميع المباريات
          وتفاصيلها.
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
          ></button>
        </div>

        <!-- Filters -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <select class="form-select" id="filterCompetition">
                  <option value="">جميع المسابقات</option>
                </select>
              </div>
              <div class="col-md-4">
                <input type="date" class="form-control" id="filterDate" />
              </div>
              <div class="col-md-4">
                <select class="form-select" id="filterStatus">
                  <option value="">جميع المباريات</option>
                  <option value="upcoming">قادمة</option>
                  <option value="past">منتهية</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Matches Table (Read-only) -->
        <div class="glass-card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0" id="matchesTable">
                <thead>
                  <tr>
                    <th>التاريخ</th>
                    <th>الوقت</th>
                    <th>الملعب</th>
                    <th>المضيف</th>
                    <th>الضيف</th>
                    <th>طاقم الحكام</th>
                    <th>ملاحظات</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody id="matchesBody">
                  <!-- Dynamic content -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Match Details Modal (Read-only) -->
    <div class="modal fade" id="matchDetailsModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">تفاصيل المباراة</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="matchDetailsContent">
            <!-- Dynamic content -->
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              إغلاق
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/viewer/viewerMatches.js"></script>
  </body>
</html>
