<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>التقارير - رئيس اللجنة - لجنة الحكام الرئيسية - التطوير</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="../assets/css/custom-sports-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar-wrapper">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fas fa-futbol"></i>
          <span>لجنة الحكام</span>
        </div>
        <div class="sidebar-user">
          <div class="avatar"><i class="fas fa-user-tie"></i></div>
          <div class="user-info">
            <span class="user-name" id="viewerName">رئيس اللجنة</span>
            <span class="user-role">مشاهد</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="viewer-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>لوحة التحكم</span>
          </a>
          <a href="viewer-matches.html" class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span>المباريات</span>
          </a>
          <a href="viewer-referees.html" class="nav-item">
            <i class="fa fa-flag-checkered"></i>
            <span>الحكام</span>
          </a>
          <a href="viewer-finance.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>المالية</span>
          </a>
          <a href="viewer-reports.html" class="nav-item active">
            <i class="fas fa-file-alt"></i>
            <span>التقارير</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button id="logoutBtn" class="btn btn-danger w-100">
            <i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <nav class="top-navbar">
        <div class="container-fluid">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
              <button
                class="sidebar-toggle btn btn-link d-lg-none"
                id="sidebarToggle"
              >
                <i class="fas fa-bars"></i>
              </button>
              <h4 class="page-title mb-0">التقارير - عرض فقط</h4>
            </div>
            <div class="top-nav-right">
              <div class="date-display" id="currentDate"></div>
            </div>
          </div>
        </div>
      </nav>

      <div class="content-wrapper">
        <!-- Read-only Notice -->
        <div class="alert alert-info alert-dismissible fade show" role="alert">
          <i class="fas fa-info-circle me-2"></i>
          هذه الصفحة للعرض فقط. يمكنك <strong>مشاهدة</strong> جميع التقارير
          والإحصائيات.
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
          ></button>
        </div>

        <!-- Report Filters -->
        <div class="glass-card mb-4">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-4">
                <select class="form-select" id="reportType">
                  <option value="matches">تقارير المباريات</option>
                  <option value="referees">تقارير الحكام</option>
                  <option value="competitions">تقارير المسابقات</option>
                  <option value="finance">تقارير مالية</option>
                </select>
              </div>
              <div class="col-md-4">
                <input
                  type="date"
                  class="form-control"
                  id="reportDateFrom"
                  placeholder="من تاريخ"
                />
              </div>
              <div class="col-md-4">
                <input
                  type="date"
                  class="form-control"
                  id="reportDateTo"
                  placeholder="إلى تاريخ"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Report Results -->
        <div class="glass-card">
          <div class="card-header">
            <h5><i class="fas fa-chart-bar me-2"></i>نتائج التقرير</h5>
          </div>
          <div class="card-body" id="reportContent">
            <div class="text-center text-muted py-5">
              <i class="fas fa-file-alt fa-3x mb-3"></i>
              <p>اختر نوع التقرير والفترة الزمنية</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/viewer/viewerReports.js"></script>
  </body>
</html>
